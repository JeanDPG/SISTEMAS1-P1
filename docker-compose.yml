
services:
  user-service:
    build: ./user-service
    container_name: p1-user-service
    command: python user.py
    ports:
      - "5050:5050"
    env_file:
      - .env
    volumes:
      - ./user-service/data:/app/data
    restart: unless-stopped

  file-service:
    build: ./file-service
    container_name: p1-file-service
    command: python file.py
    ports:
      - "5051:5051"
    env_file:
      - .env
    volumes:
      - ./file-service/data:/app/data
    restart: unless-stopped