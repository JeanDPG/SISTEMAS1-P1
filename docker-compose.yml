version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_si1
    restart: unless-stopped
    environment:
      POSTGRES_DB: si1
      POSTGRES_USER: alumnodb
      POSTGRES_PASSWORD: 1234
    ports:
      - "9999:5432"
    volumes:
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/02-populate.sql:/docker-entrypoint-initdb.d/02-populate.sql
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build: ./user-service
    container_name: p1-user-service
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://alumnodb:1234@postgres-db:5432/si1"
    volumes:
      - ./user-service/data:/app/data
    depends_on:
      - postgres-db
    restart: unless-stopped

  api-service:
    build: ./api-service
    container_name: p2-api-service
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://alumnodb:1234@postgres-db:5432/si1"
    depends_on:
      - postgres-db
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local