version: '3.8'

services:
  # ============================================================================
  # API GATEWAY (Nginx)
  # Único punto de entrada expuesto al exterior (puerto 8080).
  # ============================================================================
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - library-service
    networks:
      - internal-net

  # ============================================================================
  # MICROSERVICIO DE AUTENTICACIÓN (auth-service)
  # Puerto interno: 5050 (no accesible directamente desde el exterior)
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    volumes:
      - ./auth-service:/app
    expose:
      - "5050"
    environment:
      - PORT=5050
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - internal-net

  # ============================================================================
  # BASE DE DATOS REDIS (NoSQL con persistencia AOF)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis-db
    restart: unless-stopped
    # Persistencia AOF obligatoria según el enunciado
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - internal-net

  # ============================================================================
  # MICROSERVICIO DE BIBLIOTECA (library-service)
  # Puerto interno: 5051 (no accesible directamente desde el exterior)
  # ============================================================================
  library-service:
    build:
      context: ./library-service
      dockerfile: Dockerfile
    container_name: library-service
    restart: unless-stopped
    volumes:
      - ./library-service:/app
    expose:
      - "5051"
    environment:
      - PORT=5051
      - MONGO_URI=mongodb://mongodb:27017/library_db
    depends_on:
      - mongodb
    networks:
      - internal-net

  # ============================================================================
  # BASE DE DATOS MONGODB (NoSQL para biblioteca)
  # ============================================================================
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - internal-net

# ==============================================================================
# RED Y VOLÚMENES PERSISTENTES
# ==============================================================================
networks:
  internal-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
