events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    upstream auth_service {
        server auth-service:5050;
    }

    upstream library_service {
        server library-service:5051;
    }

    server {
        listen 8080;
        server_name localhost;

        # ======================================================================
        # 1. RUTAS DE AUTENTICACIÓN (/auth/*)
        # Redirige directamente al microservicio auth-service:5050
        # ======================================================================
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ======================================================================
        # 2. ENDPOINT DE VALIDACIÓN DE TOKEN
        # Utilizado por la directiva auth_request de Nginx y verificable externamente
        # ======================================================================
        location = /auth/validate {
            proxy_pass http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # ======================================================================
        # 3. RUTAS PROTEGIDAS DE BIBLIOTECA (/library/*)
        # Requiere validación previa mediante auth_request
        # ======================================================================
        location /library/ {
            # Valida el token con auth-service
            auth_request /auth/validate;

            # Si devuelve 200, captura el encabezado X-User-Id devuelto por auth-service
            auth_request_set $user_id $upstream_http_x_user_id;

            # Inyecta el encabezado X-User-Id hacia library-service
            proxy_set_header X-User-Id $user_id;

            # Redirige la petición a library-service:5051
            proxy_pass http://library_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
